<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Mohammad Mahdi Arbabi profile banner">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.5" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#17112a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity=".35"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <filter id="blur">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="28" fill="url(#grid)"/>

  <circle cx="1045" cy="55" r="120" fill="#22d3ee" opacity=".08" filter="url(#blur)">
    <animate attributeName="opacity" values=".05;.12;.05" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="285" r="145" fill="#8b5cf6" opacity=".08" filter="url(#blur)">
    <animate attributeName="opacity" values=".11;.05;.11" dur="6.5s" repeatCount="indefinite"/>
  </circle>

  <rect x="74" y="58" width="98" height="5" rx="2.5" fill="url(#accent)">
    <animate attributeName="width" values="70;120;98" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <text x="74" y="127" fill="#f8fafc" font-size="48" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="1">
    MOHAMMAD MAHDI ARBABI
  </text>
  <text x="76" y="176" fill="#b6c1d1" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif">
    Product-minded builder · Computer Engineering · Instructor · Creator
  </text>
  <text x="76" y="226" fill="#e2e8f0" font-size="20" font-family="Inter,Segoe UI,Arial,sans-serif">
    Building useful digital experiences with engineering, design and clear communication.
  </text>

  <g transform="translate(865 70)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="275" height="180" rx="24" stroke="#ffffff" stroke-opacity=".08"/>
    <path id="signal" d="M25 125 C65 95, 86 44, 128 67 S190 145, 245 48" stroke="url(#accent)" stroke-width="3.5" stroke-dasharray="420" stroke-dashoffset="420">
      <animate attributeName="stroke-dashoffset" values="420;0;0" dur="5.2s" repeatCount="indefinite"/>
    </path>

    <g fill="#0b1020" stroke-width="3">
      <circle cx="25" cy="125" r="8" stroke="#22d3ee">
        <animate attributeName="r" values="7;10;7" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="100" cy="59" r="8" stroke="#38bdf8">
        <animate attributeName="r" values="8;11;8" dur="2.9s" begin=".4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="154" cy="83" r="8" stroke="#60a5fa">
        <animate attributeName="r" values="7;10;7" dur="3.2s" begin=".8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="202" cy="117" r="8" stroke="#8b5cf6">
        <animate attributeName="r" values="8;11;8" dur="2.7s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="245" cy="48" r="8" stroke="#a78bfa">
        <animate attributeName="r" values="7;10;7" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <path d="M22 154H112" stroke="url(#soft)" stroke-width="3"/>
    <path d="M22 163H86" stroke="#ffffff" stroke-opacity=".11" stroke-width="3"/>
  </g>

  <text x="76" y="296" fill="#718096" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1.35">
    WEB / PRODUCT / AUTOMATION / TEACHING / CONTENT
  </text>
</svg>